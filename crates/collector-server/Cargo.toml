[package]
name = "collector-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
collector-api-types.workspace = true
collector-core.workspace = true
collector-app.workspace = true
collector-modules.workspace = true
collector-providers.workspace = true
collector-store.workspace = true
collector-client.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
utoipa.workspace = true
utoipa-axum.workspace = true
url.workspace = true

webauthn-rs = { version = "=0.5.4", default-features = false }

[dev-dependencies]
tempfile.workspace = true

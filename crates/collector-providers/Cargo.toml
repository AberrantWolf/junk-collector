[package]
name = "collector-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
junk-libs-pcm.workspace = true
junk-libs-music = { workspace = true, features = ["musicbrainz"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
collector-core.workspace = true
collector-app.workspace = true
collector-modules.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest.workspace = true
httpdate.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync"] }
junk-libs-accuraterip.workspace = true
junk-libs-dat.workspace = true
junk-libs-disc.workspace = true
junk-libs-core.workspace = true
junk-libs-audio = { workspace = true, features = ["derivative-validation"] }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

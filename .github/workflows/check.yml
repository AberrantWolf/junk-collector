name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev flac opus-tools ffmpeg
      - run: python3 scripts/check_architecture.py
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          COLLECTOR_TEST_FLAC: /usr/bin/flac
          COLLECTOR_TEST_FFMPEG: '1'
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web run test:models
      - name: Web build matches committed web/dist
        run: |
          npm --prefix web run build
          git diff --exit-code -- web/dist
      - name: Browser tests
        run: |
          npm --prefix web exec -- playwright install --with-deps chromium chrome
          cargo build --locked -p collector-server -p collector-media
          npm --prefix web test

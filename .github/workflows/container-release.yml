name: Container release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: container-release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/aberrantwolf/junk-collector
jobs:
  checks:
    uses: ./.github/workflows/check.yml

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release tag matches the workspace version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"

  build:
    needs: [checks, version]
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: junk-collector:smoke
          cache-from: type=gha,scope=collector-${{ matrix.architecture }}
          cache-to: type=gha,scope=collector-${{ matrix.architecture }},mode=max
      - run: python3 scripts/check_container.py junk-collector:smoke --smoke
      - run: python3 scripts/check_media_container.py junk-collector:smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=collector-${{ matrix.architecture }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.architecture }}
          path: /tmp/digests/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag multi-platform image
        env:
          TAG: ${{ github.event.release.tag_name }}
          CHANNEL: ${{ github.event.release.prerelease && 'preview' || 'latest' }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:$CHANNEL" \
            $(printf "$IMAGE@sha256:%s " $(ls /tmp/digests))
          docker buildx imagetools inspect "$IMAGE:$TAG"
      - name: Attach installation bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bundle=/tmp/bundle/junk-collector-container
          mkdir -p "$bundle/scripts"
          cp -r deploy/container/. "$bundle/"
          cp -r deploy/proton-bridge "$bundle/proton-bridge"
          cp scripts/configure_proton_mail.py scripts/bridge_status.py "$bundle/scripts/"
          sed -i "s|^COLLECTOR_IMAGE=.*|COLLECTOR_IMAGE=$IMAGE:$TAG|" "$bundle/.env.example"
          sed -i -e "s|\.\./proton-bridge/|proton-bridge/|g" -e "s|\.\./container/|../|g" \
                 -e "s|\.\./\.\./docs/|https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/|g" "$bundle"/*.md "$bundle"/proton-bridge/*.md
          tar -czf junk-collector-container.tar.gz -C /tmp/bundle junk-collector-container
          gh release upload "$TAG" junk-collector-container.tar.gz --clobber

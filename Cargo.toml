[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/collector-server"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
collector-api-types = { path = "crates/collector-api-types" }
collector-core = { path = "crates/collector-core" }
collector-modules = { path = "crates/collector-modules" }
collector-app = { path = "crates/collector-app" }
collector-providers = { path = "crates/collector-providers" }
collector-store = { path = "crates/collector-store" }
collector-client = { path = "crates/collector-client" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
rusqlite = { version = "0.33", features = ["bundled"] }
anyhow = "1"
tempfile = "3"
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
httpdate = "1"
junk-libs-audio = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98" }
junk-libs-accuraterip = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98" }
junk-libs-core = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98" }
junk-libs-disc = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98" }
junk-libs-disc-id = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98" }
junk-libs-game-formats = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98" }
junk-libs-dat = { git = "https://github.com/AberrantWolf/junk-libs", rev = "2c8eaf8fd5a7f3e5f4873d3463b8008039e9af98" }

[profile.release]
lto = "thin"
strip = true

# Optimize snapshot checks and prepared-media transfers in debug server builds.
[profile.dev.package.sha2]
opt-level = 3

# Audio checks stream whole discs through shared decoding/checksum loops.
# Keep development servers usable without changing the algorithms or coverage.
[profile.dev.package.junk-libs-disc]
opt-level = 3

[profile.dev.package.junk-libs-accuraterip]
opt-level = 3

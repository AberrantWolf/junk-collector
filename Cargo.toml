[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/collector-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
collector-core = { path = "crates/collector-core" }
collector-modules = { path = "crates/collector-modules" }
collector-app = { path = "crates/collector-app" }
collector-providers = { path = "crates/collector-providers" }
collector-store = { path = "crates/collector-store" }
collector-client = { path = "crates/collector-client" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
rusqlite = { version = "0.33", features = ["bundled"] }
anyhow = "1"
tempfile = "3"
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
httpdate = "1"
junk-libs-audio = { path = "../junk-libs/junk-libs-audio" }
junk-libs-accuraterip = { path = "../junk-libs/junk-libs-accuraterip" }
junk-libs-core = { path = "../junk-libs/junk-libs-core" }
junk-libs-disc = { path = "../junk-libs/junk-libs-disc" }
junk-libs-disc-id = { path = "../junk-libs/junk-libs-disc-id" }
junk-libs-game-formats = { path = "../junk-libs/junk-libs-game-formats" }
junk-libs-dat = { path = "../junk-libs/junk-libs-dat" }

[profile.release]
lto = "thin"
strip = true

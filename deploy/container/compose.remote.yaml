# Fi remote-archive profile. Always include compose.media.yaml and compose.inbox.yaml.
# Host systemd owns lifecycle; Docker must not bypass the mount preflight at boot.
services:
  collector:
    environment:
      COLLECTOR_NFS_SOURCE: ${COLLECTOR_ARCHIVE_SOURCE:?Set the intended NFS source}
    restart: "no"
    # Core listener readiness works with either normal audio or optional media.
    healthcheck:
      test: ["CMD", "python3", "-c", "import tomllib,urllib.request; c=tomllib.load(open('/data/config/collector.toml','rb')); urllib.request.urlopen('http://'+c.get('public_bind','127.0.0.1:9841')+'/healthz',timeout=1).close()"]
      interval: 5s
      timeout: 2s
      start_period: 10m
      retries: 3
    group_add: ["${COLLECTOR_ARCHIVE_GID:?Set the NAS archive writer GID}"]
  cli:
    environment:
      COLLECTOR_NFS_SOURCE: ${COLLECTOR_ARCHIVE_SOURCE}
    group_add: ["${COLLECTOR_ARCHIVE_GID}"]
  initialize:
    # Never mkdir/chown an NFS archive or the underlying mountpoint.
    entrypoint: ["/bin/false"]
  media:
    depends_on:
      collector:
        condition: service_healthy
    environment:
      COLLECTOR_ARCHIVE_ID: ${COLLECTOR_ARCHIVE_ID:?Set the enrolled archive UUID}
    restart: "no"
    group_add: ["${COLLECTOR_ARCHIVE_GID}"]
  media-https:
    restart: "no"

name: junk-collector

x-runtime: &runtime
  image: ${COLLECTOR_IMAGE:?Set COLLECTOR_IMAGE to a versioned image tag or digest}
  user: "10001:10001"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m
  entrypoint: ["junk-collector", "--config", "/data/config/collector.toml"]

services:
  collector:
    <<: *runtime
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - type: bind
        source: ${COLLECTOR_CONFIG:-${COLLECTOR_DATA:?Set COLLECTOR_DATA}/config}
        target: /data/config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COLLECTOR_ARCHIVE:-${COLLECTOR_DATA}/archive}
        target: /data/archive
        bind: {create_host_path: false}
      - type: bind
        source: ${COLLECTOR_STATE:-${COLLECTOR_DATA}/state}
        target: /data/state
        bind: {create_host_path: false}
    command: ["serve"]

  cli:
    <<: *runtime
    profiles: ["tools"]
    network_mode: none
    volumes:
      - type: bind
        source: ${COLLECTOR_CONFIG:-${COLLECTOR_DATA}/config}
        target: /data/config
        bind: {create_host_path: false}
      - type: bind
        source: ${COLLECTOR_ARCHIVE:-${COLLECTOR_DATA}/archive}
        target: /data/archive
        bind: {create_host_path: false}
      - type: bind
        source: ${COLLECTOR_STATE:-${COLLECTOR_DATA}/state}
        target: /data/state
        bind: {create_host_path: false}
      - type: bind
        source: ${COLLECTOR_BACKUPS:-${COLLECTOR_DATA}/backups}
        target: /data/backups
        bind: {create_host_path: false}
    command: ["doctor"]

  initialize:
    image: ${COLLECTOR_IMAGE}
    profiles: ["tools"]
    user: "0:0"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      COLLECTOR_HOST: ${COLLECTOR_HOST:-}
      COLLECTOR_PRIVATE_IP: ${COLLECTOR_PRIVATE_IP:-}
    volumes:
      - ${COLLECTOR_DATA}:/data
    entrypoint: ["/usr/local/bin/collector-initialize"]
